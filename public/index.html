<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salle de Jeux</title>
  <meta name="description" content="Jouez entre amis en ligne, directement dans le navigateur : 17 jeux multijoueur, profils, classements, tournois.">
  <meta name="theme-color" content="#0a0d1c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="platform.css">
  <script type="importmap">
    { "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- Barre du haut -->
  <header class="nav" id="nav">
    <a class="brand" href="#/" id="brand"><span class="logo">🎮</span><span>Salle de Jeux</span></a>
    <nav class="links" id="links">
      <a href="#/" data-page="accueil">Accueil</a>
      <a href="#/jeux" data-page="jeux">Jeux</a>
      <a href="#/nouveautes" data-page="nouveautes">Nouveautés</a>
      <a href="#/classement" data-page="classement">Classement</a>
      <a href="#/tournois" data-page="tournois">Tournois</a>
      <a href="#/boutique" data-page="boutique">Boutique</a>
      <a href="#/amis" data-page="amis">Amis <b class="badge hidden" id="friendBadge"></b></a>
      <a href="#/actus" data-page="actus">Actus</a>
      <a href="#/support" data-page="support">Aide</a>
    </nav>
    <div class="nav-right">
      <span class="status" id="status" title="Connexion au serveur"><i></i><span>Connexion…</span></span>
      <a class="coins hidden" id="coins" href="#/boutique" title="Vos pièces">🪙 <b>0</b></a>
      <button class="profile" id="profileBtn" title="Votre profil"><span class="av" id="myAvatar"></span><span id="myName"></span></button>
      <button class="btn primary small" id="loginBtn">Se connecter</button>
      <button class="burger" id="burger" aria-label="Menu">☰</button>
    </div>
  </header>

  <!-- Bandeau « vous êtes dans un salon » -->
  <div class="roombar hidden" id="roombar"><span id="roombarText"></span><button class="btn primary small" id="roombarBack">Revenir au salon</button></div>

  <!-- ===================== PAGES ===================== -->
  <main id="pages" class="screen"></main>

  <!-- ===================== SALON D'ATTENTE ===================== -->
  <main id="lobby" class="screen hidden">
    <button class="back" id="leaveBtn">← Quitter le salon</button>
    <div class="lobby-grid">
      <section class="panel lobby-main">
        <div class="lobby-banner" id="lobbyBanner">
          <div><span class="kicker">Salon d'attente</span><h1 id="lobbyGame"></h1></div>
        </div>
        <div class="invite">
          <div class="code-box"><span class="muted">Code du salon</span><div class="big-code" id="lobbyCode"></div></div>
          <div class="invite-actions">
            <button class="btn primary" id="copyLink">🔗 Copier le lien d'invitation</button>
            <button class="btn ghost" id="copyCode">Copier le code</button>
            <button class="btn ghost hidden" id="shareBtn">📤 Partager</button>
          </div>
        </div>
        <div class="section-head"><h2>Joueurs <span class="count" id="playerCount"></span></h2></div>
        <ul id="lobbyPlayers" class="players"></ul>
        <div id="rankedWrap" class="ranked hidden"></div>
        <div id="settingsWrap" class="hidden">
          <div class="section-head"><h2>Paramètres de la partie</h2><span class="muted" id="settingsNote"></span></div>
          <div id="settings" class="settings"></div>
        </div>
        <div class="start-bar">
          <p id="lobbyInfo"></p>
          <button class="btn primary big" id="startBtn">▶ Lancer la partie</button>
        </div>
      </section>
      <aside class="lobby-side">
        <section class="panel"><h3>🎙️ Salon vocal</h3><div id="voiceBox"></div></section>
        <section class="panel" id="inviteBox"><h3>✉️ Inviter des amis</h3><div id="inviteList"></div></section>
        <section class="panel"><h3>Comment jouer</h3><div id="rules" class="rules"></div></section>
        <section class="panel chat">
          <h3>Discussion</h3>
          <div class="chat-log" id="chatLog"><p class="muted empty">Dites bonjour 👋</p></div>
          <form class="chat-form" id="chatForm" autocomplete="off"><input id="chatInput" maxlength="200" placeholder="Écrire un message…"><button class="btn primary" aria-label="Envoyer">➤</button></form>
        </section>
      </aside>
    </div>
  </main>

  <!-- ===================== JEU ===================== -->
  <section id="game" class="screen hidden"></section>

  <!-- Vocal flottant (visible en jeu) -->
  <div class="voicefab hidden" id="voiceFab"></div>

  <!-- Connexion / inscription -->
  <dialog id="authDialog">
    <form method="dialog" id="authForm" autocomplete="on">
      <div class="tabs2"><button type="button" class="on" data-mode="login">Se connecter</button><button type="button" data-mode="register">Créer un compte</button><button type="button" data-mode="guest">Invité</button></div>
      <p class="muted" id="authHelp"></p>
      <label class="fld"><span>Pseudo</span><input id="authName" maxlength="16" autocomplete="username" required></label>
      <label class="fld pw"><span>Mot de passe</span><input id="authPass" type="password" autocomplete="current-password"></label>
      <p class="err" id="authErr"></p>
      <div class="dlg-actions"><button class="btn primary big" id="authSubmit" value="ok">Se connecter</button><button type="button" class="btn ghost" id="authCancel">Annuler</button></div>
    </form>
  </dialog>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
