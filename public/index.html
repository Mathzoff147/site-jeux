<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salle de Jeux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <!-- Accueil -->
  <section id="home" class="screen">
    <div class="card">
      <h1>🎮 Salle de Jeux</h1>
      <p class="sub">Jouez entre amis, en ligne, dans votre navigateur.</p>
      <label>Votre pseudo <input id="name" maxlength="16" placeholder="Pseudo"></label>
      <h2>Créer un salon</h2>
      <div id="gameList" class="games"></div>
      <h2>Rejoindre</h2>
      <div class="row">
        <input id="code" maxlength="4" placeholder="CODE" style="text-transform:uppercase">
        <button id="joinBtn">Rejoindre</button>
      </div>
      <div id="roomList" class="rooms"></div>
    </div>
  </section>

  <!-- Salon d'attente -->
  <section id="lobby" class="screen hidden">
    <div class="card">
      <h1 id="lobbyGame"></h1>
      <p class="sub">Code du salon : <b id="lobbyCode" class="code"></b> — partagez-le à vos amis</p>
      <ul id="lobbyPlayers" class="players"></ul>
      <p id="lobbyInfo" class="sub"></p>
      <div class="row">
        <button id="startBtn">Lancer la partie</button>
        <button id="leaveBtn" class="ghost">Quitter</button>
      </div>
    </div>
  </section>

  <!-- Jeu -->
  <section id="game" class="screen hidden"></section>

  <div id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
